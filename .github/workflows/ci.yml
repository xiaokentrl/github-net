name: CI

# 门禁判据来自 TECHNICAL_PLAN 的「实现前决策与验证门槛」和 FRONTEND_BACKEND_STRUCTURE_PLAN 的「兼容性规则」。
# Linux 发布线：目标为 Debian 13 与 Ubuntu 26.04，构建宿主为 ubuntu:26.04 容器。
# runs-on 只是 Actions 的宿主 VM，不代表支持目标；真正的构建环境是下面 container 里的镜像。
# arm64、Windows、macOS 还没进门禁。

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GLIBC_LIMIT: "2.41"
  RUNTIME_LIBS: "libgtk-4.so.1 libwebkitgtk-6.0.so.4 libjavascriptcoregtk-6.0.so.1"

jobs:
  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 类型检查并打包
        run: npm ci && npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  backend:
    name: 后端检查（Ubuntu 26.04 宿主）
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    needs: frontend
    steps:
      - name: 装构建依赖
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl git xz-utils gcc pkg-config binutils libgtk-4-dev libwebkitgtk-6.0-dev
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 取前端产物
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: 格式化检查
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: 静态检查与测试
        run: go vet ./... && go test -count=1 ./...

  linux-x64:
    name: Linux x64 出包与门一（Ubuntu 26.04 宿主）
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    needs: frontend
    steps:
      - name: 装构建依赖
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl git xz-utils gcc pkg-config binutils libgtk-4-dev libwebkitgtk-6.0-dev
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 取前端产物
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: 构建产物
        run: |
          # 容器里 checkout 出来的目录属主和跑任务的用户对不上，git 直接拒绝读版本信息
          # （fatal: detected dubious ownership，退出码 128），go build 的 VCS 打标因此失败。
          # 已在 golang:1.27.3 容器里逐字复现：不放行时 go build 退出码 1，放行后产物带 vcs.revision。
          # 临时文件一律写在仓库外，否则工作区变脏，产物的 vcs.modified 就证明不了任何东西。
          git config --global --add safe.directory "$GITHUB_WORKSPACE" 2> "$RUNNER_TEMP/vcs.err" || {
            echo "::error::放行工作目录属主失败（HOME=$HOME）：$(tr '\n\r' '  ' < "$RUNNER_TEMP/vcs.err")"
            exit 1
          }
          # 先单独问一次 git：还读不到仓库就在这里报清楚，别拖到 go build 变成一句 exit 128。
          git rev-parse HEAD > /dev/null 2> "$RUNNER_TEMP/vcs.err" || {
            echo "::error::git 仍读不了仓库：$(tr '\n\r' '  ' < "$RUNNER_TEMP/vcs.err")"
            exit 1
          }
          # 失败原因写进 annotations：公开接口就能读到，不用登录翻作业正文。
          {
            echo "go=$(go env GOVERSION) cgo=$(go env CGO_ENABLED) cc=$(go env CC)"
            gcc --version | head -1
            ld --version | head -1 || true
            pkg-config --modversion gtk4 webkitgtk-6.0 || true
            echo "前端产物：$(find frontend/dist -type f | wc -l) 个文件，$(du -sh frontend/dist | cut -f1)"
            df -h "$GITHUB_WORKSPACE" | tail -1
          } > "$RUNNER_TEMP/build.env" 2>&1
          cat "$RUNNER_TEMP/build.env"
          if ! CGO_ENABLED=1 go build -trimpath -o bin/github-net . > "$RUNNER_TEMP/build.log" 2>&1; then
            msg=$(sed 's/%/%25/g' "$RUNNER_TEMP/build.log" | tr '\n\r' '  ' | cut -c1-1000)
            echo "::error::构建产物失败：$msg"
            cat "$RUNNER_TEMP/build.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/build.log"
          # 打标是否真的生效，留一行可核对的证据。
          go version -m bin/github-net | grep -E 'vcs.revision|vcs.modified' || echo "::warning::产物没有 VCS 打标信息"
      - name: 门一 产物 glibc 符号不高于门槛
        run: |
          max=$(objdump -T bin/github-net | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)
          echo "产物最高 glibc 符号：$max，门槛：$GLIBC_LIMIT"
          newest=$(printf '%s\n%s\n' "$max" "$GLIBC_LIMIT" | sort -V | tail -1)
          test "$newest" = "$GLIBC_LIMIT" || { echo "::error::门一不过：$max 高于 $GLIBC_LIMIT"; exit 1; }
      - name: 门二 在 Ubuntu 26.04 复核动态链接
        run: |
          ldd -r bin/github-net > ldd.txt 2>&1
          cat ldd.txt
          if grep -E 'not found|undefined symbol' ldd.txt; then echo "::error::门二不过：Ubuntu 26.04 有未解析依赖"; exit 1; fi
          for so in $RUNTIME_LIBS; do grep -q "$so => /" ldd.txt || { echo "::error::门二不过：Ubuntu 26.04 缺 $so"; exit 1; }; done
      - uses: actions/upload-artifact@v4
        with:
          name: github-net-linux-amd64
          path: bin/github-net
          if-no-files-found: error

  linux-x64-debian13:
    name: 门二 复核 Debian 13 运行库
    runs-on: ubuntu-latest
    container:
      image: debian:13
    needs: linux-x64
    steps:
      - name: 装运行库
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates binutils libgtk-4-1 libwebkitgtk-6.0-4
      - uses: actions/download-artifact@v4
        with:
          name: github-net-linux-amd64
          path: bin
      - name: 动态链接必须全部解析
        run: |
          chmod +x bin/github-net
          ldd -r bin/github-net > ldd.txt 2>&1
          cat ldd.txt
          if grep -E 'not found|undefined symbol' ldd.txt; then echo "::error::门二不过：Debian 13 有未解析依赖"; exit 1; fi
          for so in $RUNTIME_LIBS; do grep -q "$so => /" ldd.txt || { echo "::error::门二不过：Debian 13 缺 $so"; exit 1; }; done
