# Feel free to remove those if you don't want/need to use them.
# Make sure to check the documentation at https://nfpm.goreleaser.com
#
# The lines below are called `modelines`. See `:help modeline`

name: "github-net"
arch: ${GOARCH}
platform: "linux"
# version 由 scripts/version.sh（main.go 的 appVersion）同步，Taskfile 打包前自动改写；
# 手改无效——门禁测试会锁「nfpm 版本 == 应用版本」。
version: "0.1.21"
section: "default"
priority: "extra"
maintainer: ${GIT_COMMITTER_NAME} <${GIT_COMMITTER_EMAIL}>
description: "GitHub 和 Steam 网络加速工具"
vendor: "xiaokentrl"
homepage: "https://wails.io"
license: "MIT"
release: "1"

contents:
  - src: "./bin/github-net"
    dst: "/opt/github-net/bin/github-net"
  # 特权辅助服务：libexec 语义（systemd 拉起，不进 PATH——不该让用户直接敲）。
  - src: "./bin/github-net-helper"
    dst: "/opt/github-net/libexec/github-net-helper"
  - src: "./build/linux/systemd/github-net-helper.service"
    dst: "/usr/lib/systemd/system/github-net-helper.service"
  - src: "./build/appicon.png"
    dst: "/opt/github-net/share/icons/github-net.png"
  # 桌面项本体在 /opt/share，文件名跟 AppID 走（identity.DesktopFile 单源；
  # 用户级入口 ~/.local/share/applications 软链由首启自建指到这里）。
  - src: "./build/linux/io.github.xiaokentrl.githubnet.desktop"
    dst: "/opt/github-net/share/io.github.xiaokentrl.githubnet.desktop"
  # 目录登记：/var/opt/github-net（postinstall 建 backups 子目录并 chmod 700/chown root）。
  - dst: "/var/opt/github-net"
    type: dir

# Default dependencies for the GTK4 + WebKitGTK 6.0 stack (Ubuntu 24.04+ / Debian 13+)
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4

# Distribution-specific overrides for different package formats
overrides:
  # RPM packages for Fedora / RHEL / AlmaLinux / Rocky Linux
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0

  # Arch Linux packages
  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0

# scripts section to ensure desktop database is updated after install
scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
  # You can also add preremove, postremove if needed
  # preremove: "./build/linux/nfpm/scripts/preremove.sh"
  # postremove: "./build/linux/nfpm/scripts/postremove.sh"

# If you build your app with -tags gtk3 (legacy WebKit2GTK 4.1 stack — supported through v3.0.x, removed in v3.1),
# replace the depends/overrides above with these:
#
# depends:
#   - libgtk-3-0
#   - libwebkit2gtk-4.1-0
# overrides:
#   rpm:
#     depends:
#       - gtk3
#       - webkit2gtk4.1
#   archlinux:
#     depends:
#       - gtk3
#       - webkit2gtk-4.1
#
# replaces:
#   - foobar
# provides:
#   - bar
# recommends:
#   - whatever
# suggests:
#   - something-else
# conflicts:
#   - not-foo
#   - not-bar
# changelog: "changelog.yaml"
